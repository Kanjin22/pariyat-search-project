server {
    listen 80;
    listen [::]:80;
    server_name pariyat.example.com;   # <-- เปลี่ยนเป็นโดเมน/ไอพีของคุณ

    # ตรงกับ app.config['MAX_CONTENT_LENGTH'] = 20MB (import Excel)
    client_max_body_size 25m;

    access_log /var/log/nginx/pariyat-search.access.log;
    error_log  /var/log/nginx/pariyat-search.error.log;

    # ไม่ให้ใครเข้าถึงไฟล์ซ่อน (เช่น .env, .git)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # gunicorn ทำงานที่ 127.0.0.1:8000 (ดู deploy/pariyat-search.env.example)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # การ import Excel / โหลด snapshot ใช้เวลานาน ตั้ง timeout ให้พอ
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
