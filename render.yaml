services:
  - type: web
    name: pariyat-search
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --preload --bind 0.0.0.0:$PORT app.app:app
    healthCheckPath: /health
    healthCheckInitialTimeout: 300
    healthCheckInterval: 30
    healthCheckTimeout: 10
    numInstances: 1
    autoDeploy: yes
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: LOGS_DIR
        value: /tmp/logs

